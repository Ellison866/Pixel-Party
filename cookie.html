<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookie Clicker — Pixel Party</title><link rel="stylesheet" href="styles.css"></head><body class="game-page"><div class="game-shell"><nav class="game-nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><a class="back-link" href="index.html">← all games</a></nav><header class="game-title"><p class="eyebrow">GAME 04</p><h1>Cookie Clicker</h1><p>One click closer to cookie greatness.</p></header><main class="game-wrap cookie-wrap"><div class="cookie-score"><span>Cookies baked</span><strong id="count">0</strong><small><b id="rate">0</b> per second</small></div><button class="big-cookie" id="cookie" aria-label="Click the cookie">🍪</button><p class="controls">Click the cookie · Buy upgrades to bake faster</p><section class="upgrades"><button class="upgrade" id="cursor" disabled><span>🖱️ Cursor</span><b>+1/sec · <i>15</i> 🍪</b></button><button class="upgrade" id="oven" disabled><span>🔥 Tiny oven</span><b>+5/sec · <i>75</i> 🍪</b></button><button class="upgrade" id="factory" disabled><span>🏭 Factory</span><b>+25/sec · <i>250</i> 🍪</b></button></section><button class="game-button" id="reset">Reset bakery</button></main></div><script>let count=0,rate=0;const countEl=document.getElementById('count'),rateEl=document.getElementById('rate'),cookie=document.getElementById('cookie'),upgrades=[{el:document.getElementById('cursor'),cost:15,boost:1},{el:document.getElementById('oven'),cost:75,boost:5},{el:document.getElementById('factory'),cost:250,boost:25}];function update(){countEl.textContent=Math.floor(count);rateEl.textContent=rate;upgrades.forEach(u=>{u.el.disabled=count<u.cost;u.el.querySelector('i').textContent=u.cost})}cookie.onclick=()=>{count++;cookie.classList.remove('pop');void cookie.offsetWidth;cookie.classList.add('pop');update()};upgrades.forEach(u=>u.el.onclick=()=>{if(count>=u.cost){count-=u.cost;rate+=u.boost;u.cost=Math.ceil(u.cost*1.8);update()}});document.getElementById('reset').onclick=()=>{count=0;rate=0;upgrades[0].cost=15;upgrades[1].cost=75;upgrades[2].cost=250;update()};setInterval(()=>{count+=rate/10;update()},100);update()</script></body></html>
