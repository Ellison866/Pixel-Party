<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake — Pixel Party</title><link rel="stylesheet" href="styles.css"></head><body class="game-page"><div class="game-shell"><nav class="game-nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><a class="back-link" href="index.html">← all games</a></nav><header class="game-title"><p class="eyebrow">GAME 01</p><h1>Snake</h1><p>Eat the dots. Grow your score.</p></header><main class="game-wrap"><div class="hud"><span>Score <strong id="score">0</strong></span><span id="status">Ready?</span></div><canvas id="board" width="420" height="420" aria-label="Snake game board"></canvas><p class="controls">Arrow keys or WASD to move · Space to pause</p><button class="game-button" id="restart">Start / restart</button></main></div><script>const c=document.getElementById('board'),x=c.getContext('2d'),N=21,S=c.width/N;let snake,food,dir,next,score,running,loop;function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food=spawn();dir={x:1,y:0};next=dir;score=0;running=false;document.getElementById('score').textContent=0;document.getElementById('status').textContent='Ready?';draw()}function spawn(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake&&snake.some(q=>q.x===p.x&&q.y===p.y));return p}function draw(){x.fillStyle='#20201e';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#2d2c29';for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}x.fillStyle='#ff7048';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.3,0,7);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?'#b8e4cc':'#ffc84a';x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)})}function tick(){let h={x:snake[0].x+next.x,y:snake[0].y+next.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){running=false;clearInterval(loop);document.getElementById('status').textContent='Game over';return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;document.getElementById('score').textContent=score;food=spawn()}else snake.pop();draw()}function start(){if(running)return;running=true;document.getElementById('status').textContent='Playing';loop=setInterval(tick,115)}addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k===' '){running? (running=false,clearInterval(loop),document.getElementById('status').textContent='Paused'):start();return}let d={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}}[k];if(d&&d.x!==-dir.x||d&&d.y!==-dir.y)next=d;if(d)start()});document.getElementById('restart').onclick=()=>{reset();start()};reset();</script><script>start=function(){if(running)return;running=true;document.getElementById('status').textContent='Playing';loop=setInterval(tick,165)};document.getElementById('restart').onclick=()=>{clearInterval(loop);loop=null;reset();start()};</script><script>addEventListener('keydown',e=>{const k=e.key.toLowerCase();const d={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}}[k];if(d){e.preventDefault();if(d.x!==-next.x||d.y!==-next.y){next=d;start()}}});</script></body></html>
