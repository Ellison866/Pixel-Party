<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snake - Pixel Party</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="game-page">
  <div class="game-shell">
    <nav class="game-nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><a class="back-link" href="index.html">← all games</a></nav>
    <header class="game-title"><p class="eyebrow">GAME 01</p><h1>Snake</h1><p>Eat the dots. Grow your score.</p></header>
    <main class="game-wrap">
      <div class="hud"><span>Score <strong id="score">0</strong></span><span id="status">Ready?</span></div>
      <canvas id="board" width="420" height="420" aria-label="Snake game board"></canvas>
      <p class="controls">Arrow keys or WASD to move - Space to pause</p>
      <div class="mobile-controls" aria-label="Snake controls">
        <button type="button" data-dir="up" aria-label="Move up">&#8593;</button>
        <button type="button" data-dir="left" aria-label="Move left">&#8592;</button>
        <button type="button" data-dir="down" aria-label="Move down">&#8595;</button>
        <button type="button" data-dir="right" aria-label="Move right">&#8594;</button>
      </div>
      <button class="game-button" id="restart">Start / restart</button>
    </main>
  </div>
  <script>
    const canvas = document.getElementById('board');
    const context = canvas.getContext('2d');
    const size = 21;
    const cell = canvas.width / size;
    let snake, food, direction, nextDirection, score, running, timer;
    const directions = {
      arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
      arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
      arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
      arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 }
    };

    function spawnFood() {
      let point;
      do point = { x: Math.floor(Math.random() * size), y: Math.floor(Math.random() * size) };
      while (snake.some(part => part.x === point.x && part.y === point.y));
      return point;
    }

    function draw() {
      context.fillStyle = '#20201e';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.strokeStyle = '#2d2c29';
      for (let i = 1; i < size; i++) {
        context.beginPath(); context.moveTo(i * cell, 0); context.lineTo(i * cell, canvas.height); context.stroke();
        context.beginPath(); context.moveTo(0, i * cell); context.lineTo(canvas.width, i * cell); context.stroke();
      }
      context.fillStyle = '#ff7048';
      context.beginPath();
      context.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * .3, 0, Math.PI * 2);
      context.fill();
      snake.forEach((part, index) => {
        context.fillStyle = index ? '#b8e4cc' : '#ffc84a';
        context.fillRect(part.x * cell + 2, part.y * cell + 2, cell - 4, cell - 4);
      });
    }

    function reset() {
      clearInterval(timer);
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      food = spawnFood();
      score = 0;
      running = false;
      document.getElementById('score').textContent = '0';
      document.getElementById('status').textContent = 'Ready?';
      draw();
    }

    function start() {
      if (running) return;
      running = true;
      document.getElementById('status').textContent = 'Playing';
      timer = setInterval(tick, 165);
    }

    function setDirection(next) {
      if (next.x === -nextDirection.x && next.y === -nextDirection.y) return;
      nextDirection = next;
      start();
    }

    function tick() {
      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      if (head.x < 0 || head.x >= size || head.y < 0 || head.y >= size || snake.some(part => part.x === head.x && part.y === head.y)) {
        running = false;
        clearInterval(timer);
        document.getElementById('status').textContent = 'Game over';
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        food = spawnFood();
      } else snake.pop();
      draw();
    }

    function togglePause() {
      if (running) {
        running = false;
        clearInterval(timer);
        document.getElementById('status').textContent = 'Paused';
      } else start();
    }

    addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if (key === ' ') { event.preventDefault(); togglePause(); return; }
      if (directions[key]) { event.preventDefault(); setDirection(directions[key]); }
    });
    document.querySelectorAll('[data-dir]').forEach(button => button.addEventListener('click', () => setDirection(directions['arrow' + button.dataset.dir])));
    document.getElementById('restart').addEventListener('click', () => { reset(); start(); });
    reset();
  </script>
</body>
</html>
