<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong — Pixel Party</title><link rel="stylesheet" href="styles.css"></head><body class="game-page"><div class="game-shell"><nav class="game-nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><a class="back-link" href="index.html">← all games</a></nav><header class="game-title"><p class="eyebrow">GAME 03</p><h1>Pong</h1><p>Beat the computer. First to 7 wins.</p></header><main class="game-wrap"><div class="hud"><span>You <strong id="playerScore">0</strong></span><span id="status">Ready?</span><span>CPU <strong id="cpuScore">0</strong></span></div><canvas id="pong" width="700" height="400" class="pong-game" aria-label="Pong game board"></canvas><p class="controls">Move with ↑ ↓ or W S · First to 7 wins</p><button class="game-button" id="restart">Start / restart</button></main></div><script>const c=document.getElementById('pong'),x=c.getContext('2d');let p,cpu,ball,ps,cs,run,raf;function reset(){p={y:170};cpu={y:170};ball={x:350,y:200,vx:5,vy:3};ps=0;cs=0;run=false;paint();document.getElementById('playerScore').textContent=0;document.getElementById('cpuScore').textContent=0;document.getElementById('status').textContent='Ready?'}function paint(){x.fillStyle='#20201e';x.fillRect(0,0,700,400);x.strokeStyle='#5a554e';x.setLineDash([9,12]);x.beginPath();x.moveTo(350,0);x.lineTo(350,400);x.stroke();x.setLineDash([]);x.fillStyle='#b8e4cc';x.fillRect(20,p.y,12,60);x.fillStyle='#80b7ff';x.fillRect(668,cpu.y,12,60);x.fillStyle='#ffc84a';x.beginPath();x.arc(ball.x,ball.y,9,0,7);x.fill()}function loop(){if(!run)return;if(keys.up)p.y=Math.max(0,p.y-7);if(keys.down)p.y=Math.min(340,p.y+7);cpu.y+=(ball.y-30-cpu.y)*.065;ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y<9||ball.y>391)ball.vy*=-1;if(ball.x<32&&ball.y>p.y-8&&ball.y<p.y+68){ball.vx=Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-(p.y+30))*.08}if(ball.x>660&&ball.y>cpu.y-8&&ball.y<cpu.y+68){ball.vx=-Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-(cpu.y+30))*.08}if(ball.x<0){cs++;point()}if(ball.x>700){ps++;point()}paint();raf=requestAnimationFrame(loop)}function point(){document.getElementById('playerScore').textContent=ps;document.getElementById('cpuScore').textContent=cs;if(ps>=7||cs>=7){run=false;document.getElementById('status').textContent=ps>cs?'You win!':'CPU wins';return}ball={x:350,y:200,vx:(ps+cs)%2? -5:5,vy:3};}const keys={up:false,down:false};addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')keys.up=true;if(k==='arrowdown'||k==='s')keys.down=true;if(k===' '&&!run)begin()});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')keys.up=false;if(k==='arrowdown'||k==='s')keys.down=false});function begin(){reset();run=true;document.getElementById('status').textContent='Playing';loop()}document.getElementById('restart').onclick=begin;reset()</script></body></html>
