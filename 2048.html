<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2048 - Pixel Party</title><link rel="stylesheet" href="styles.css">
</head>
<body class="game-page">
  <div class="game-shell">
    <nav class="game-nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><a class="back-link" href="index.html">← all games</a></nav>
    <header class="game-title"><p class="eyebrow">GAME 02</p><h1>2048</h1><p>Slide the tiles. Reach 2048.</p></header>
    <main class="game-wrap">
      <div class="hud"><span>Score <strong id="score">0</strong></span><span id="status">Your move</span></div>
      <div class="board" id="board" aria-label="2048 game board"></div>
      <p class="controls">Arrow keys or WASD to slide - Combine matching numbers</p>
      <div class="mobile-controls" aria-label="2048 controls">
        <button type="button" data-move="up" aria-label="Slide up">&#8593;</button>
        <button type="button" data-move="left" aria-label="Slide left">&#8592;</button>
        <button type="button" data-move="down" aria-label="Slide down">&#8595;</button>
        <button type="button" data-move="right" aria-label="Slide right">&#8594;</button>
      </div>
      <button class="game-button" id="restart">New game</button>
    </main>
  </div>
  <script>
    const board = document.getElementById('board');
    const scoreElement = document.getElementById('score');
    const statusElement = document.getElementById('status');
    let grid, score;
    const moves = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };

    function start() { grid = Array(16).fill(0); score = 0; statusElement.textContent = 'Your move'; add(); add(); render(); }
    function add() { const empty = grid.map((value, index) => value ? null : index).filter(index => index !== null); if (empty.length) grid[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < .9 ? 2 : 4; }
    function render() { board.innerHTML = ''; grid.forEach(value => { const tile = document.createElement('div'); tile.className = 'tile'; if (value) tile.dataset.value = value; tile.textContent = value || ''; board.append(tile); }); scoreElement.textContent = score; }
    function slide(row) { const values = row.filter(Boolean); for (let i = 0; i < values.length - 1; i++) if (values[i] === values[i + 1]) { values[i] *= 2; score += values[i]; values.splice(i + 1, 1); } return values.concat(Array(4 - values.length).fill(0)); }
    function move(dx, dy) {
      const before = grid.join();
      const next = Array(16).fill(0);
      if (dx) for (let row = 0; row < 4; row++) { let values = grid.slice(row * 4, row * 4 + 4); if (dx > 0) values.reverse(); values = slide(values); if (dx > 0) values.reverse(); next.splice(row * 4, 4, ...values); }
      else for (let col = 0; col < 4; col++) { let values = [grid[col], grid[col + 4], grid[col + 8], grid[col + 12]]; if (dy > 0) values.reverse(); values = slide(values); if (dy > 0) values.reverse(); values.forEach((value, row) => next[row * 4 + col] = value); }
      grid = next;
      if (before === grid.join()) return;
      add(); render();
      if (grid.includes(2048)) statusElement.textContent = 'You made 2048!';
      else if (!canMove()) statusElement.textContent = 'Game over';
    }
    function canMove() { for (let i = 0; i < 16; i++) if (!grid[i] || (i % 4 < 3 && grid[i] === grid[i + 1]) || (i < 12 && grid[i] === grid[i + 4])) return true; return false; }
    function triggerMove(name) { move(...moves[name]); }
    addEventListener('keydown', event => { const key = event.key.toLowerCase(); const name = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down' }[key]; if (name) { event.preventDefault(); triggerMove(name); } });
    document.querySelectorAll('[data-move]').forEach(button => button.addEventListener('click', () => triggerMove(button.dataset.move)));
    document.getElementById('restart').addEventListener('click', start);
    start();
  </script>
</body>
</html>
