<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 — Pixel Party</title><link rel="stylesheet" href="styles.css"></head><body class="game-page"><div class="game-shell"><nav class="game-nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><a class="back-link" href="index.html">← all games</a></nav><header class="game-title"><p class="eyebrow">GAME 02</p><h1>2048</h1><p>Slide the tiles. Reach 2048.</p></header><main class="game-wrap"><div class="hud"><span>Score <strong id="score">0</strong></span><span id="status">Your move</span></div><div class="board" id="board" aria-label="2048 game board"></div><p class="controls">Arrow keys or WASD to slide · Combine matching numbers</p><button class="game-button" id="restart">New game</button></main></div><script>const board=document.getElementById('board'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');let grid,score;function start(){grid=Array(16).fill(0);score=0;add();add();render()}function add(){let empty=grid.map((v,i)=>v?null:i).filter(v=>v!==null);if(empty.length)grid[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4}function render(){board.innerHTML='';grid.forEach(v=>{let t=document.createElement('div');t.className='tile';if(v)t.dataset.value=v;t.textContent=v||'';board.append(t)});scoreEl.textContent=score}function slide(row){let a=row.filter(Boolean);for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}return a.concat(Array(4-a.length).fill(0))}function move(dx,dy){let before=grid.join();let next=Array(16).fill(0);if(dx){for(let r=0;r<4;r++){let row=grid.slice(r*4,r*4+4);if(dx>0)row.reverse();let out=slide(row);if(dx>0)out.reverse();next.splice(r*4,4,...out)}}else{for(let col=0;col<4;col++){let row=[grid[col],grid[col+4],grid[col+8],grid[col+12]];if(dy>0)row.reverse();let out=slide(row);if(dy>0)out.reverse();out.forEach((v,r)=>next[r*4+col]=v)}}grid=next;if(before!==grid.join()){add();render();if(grid.includes(2048))statusEl.textContent='You made 2048!';else if(!canMove())statusEl.textContent='Game over'} }function canMove(){for(let i=0;i<16;i++)if(!grid[i]||(i%4<3&&grid[i]===grid[i+1])||(i<12&&grid[i]===grid[i+4]))return true;return false}addEventListener('keydown',e=>{let k=e.key.toLowerCase(),d={arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0],arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1]}[k];if(d){e.preventDefault();move(...d)}});document.getElementById('restart').onclick=start;start()</script></body></html>
