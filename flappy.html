<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Dot — Pixel Party</title><link rel="stylesheet" href="styles.css"></head><body class="game-page"><div class="game-shell"><nav class="game-nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><a class="back-link" href="index.html">← all games</a></nav><header class="game-title"><p class="eyebrow">GAME 06</p><h1>Flappy Dot</h1><p>Tap to fly through the gaps.</p></header><main class="game-wrap"><div class="hud"><span>Score <strong id="score">0</strong></span><span id="status">Ready?</span></div><canvas id="game" width="500" height="420" aria-label="Flappy Dot game board"></canvas><p class="controls">Press Space, click, or tap to flap</p><button class="game-button" id="restart">Start / restart</button></main></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let bird,pipes,score,run,frame;function reset(){bird={x:100,y:210,vy:0};pipes=[];score=0;frame=0;run=false;document.getElementById('score').textContent=0;document.getElementById('status').textContent='Ready?';draw()}function flap(){if(!run){run=true;document.getElementById('status').textContent='Playing';loop()}bird.vy=-7}function draw(){x.fillStyle='#80b7ff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#b8e4cc';pipes.forEach(p=>{x.fillRect(p.x,0,45,p.top);x.fillRect(p.x,p.top+120,45,c.height)});x.fillStyle='#ffc84a';x.beginPath();x.arc(bird.x,bird.y,14,0,7);x.fill();x.fillStyle='#20201e';x.fillRect(bird.x+7,bird.y-5,4,4)}function loop(){if(!run)return;frame++;bird.vy+=.35;bird.y+=bird.vy;if(frame%95===0)pipes.push({x:c.width,top:55+Math.random()*210,passed:false});pipes.forEach(p=>p.x-=3);pipes=pipes.filter(p=>p.x>-50);pipes.forEach(p=>{if(!p.passed&&p.x<bird.x){p.passed=true;score++;document.getElementById('score').textContent=score}if(bird.x+14>p.x&&bird.x-14<p.x+45&&(bird.y-14<p.top||bird.y+14>p.top+120))crash()});if(bird.y<0||bird.y>c.height)crash();draw();if(run)requestAnimationFrame(loop)}function crash(){run=false;document.getElementById('status').textContent='Game over'}addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});c.addEventListener('click',flap);document.getElementById('restart').onclick=()=>{reset();flap()};reset()</script></body></html>
