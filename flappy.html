<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Dot - Pixel Party</title><link rel="stylesheet" href="styles.css"></head>
<body class="game-page"><div class="game-shell"><nav class="game-nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><a class="back-link" href="index.html">← all games</a></nav><header class="game-title"><p class="eyebrow">GAME 06</p><h1>Flappy Dot</h1><p>Tap to fly through the gaps.</p></header><main class="game-wrap"><div class="hud"><span>Score <strong id="score">0</strong></span><span id="status">Ready?</span></div><canvas id="game" width="500" height="420" aria-label="Flappy Dot game board"></canvas><p class="controls">Press Space, click, or tap to flap</p><button class="game-button" id="restart">Start / restart</button></main></div>
<script>
const canvas=document.getElementById('game'),context=canvas.getContext('2d');let bird,pipes,score,frameCount,running,frame;
function reset(){cancelAnimationFrame(frame);bird={x:100,y:210,vy:0};pipes=[];score=0;frameCount=0;running=false;document.getElementById('score').textContent='0';document.getElementById('status').textContent='Ready?';draw()}
function flap(){if(!running){running=true;document.getElementById('status').textContent='Playing';loop()}bird.vy=-7}
function draw(){context.fillStyle='#80b7ff';context.fillRect(0,0,canvas.width,canvas.height);context.fillStyle='#b8e4cc';pipes.forEach(pipe=>{context.fillRect(pipe.x,0,45,pipe.top);context.fillRect(pipe.x,pipe.top+120,45,canvas.height)});context.fillStyle='#ffc84a';context.beginPath();context.arc(bird.x,bird.y,14,0,Math.PI*2);context.fill();context.fillStyle='#20201e';context.fillRect(bird.x+7,bird.y-5,4,4)}
function crash(){running=false;document.getElementById('status').textContent='Game over'}
function loop(){if(!running)return;frameCount++;bird.vy+=.35;bird.y+=bird.vy;if(frameCount%95===0)pipes.push({x:canvas.width,top:55+Math.random()*210,passed:false});pipes.forEach(pipe=>pipe.x-=3);pipes=pipes.filter(pipe=>pipe.x>-50);pipes.forEach(pipe=>{if(!pipe.passed&&pipe.x<bird.x){pipe.passed=true;score++;document.getElementById('score').textContent=score}if(bird.x+14>pipe.x&&bird.x-14<pipe.x+45&&(bird.y-14<pipe.top||bird.y+14>pipe.top+120))crash()});if(bird.y<0||bird.y>canvas.height)crash();draw();if(running)frame=requestAnimationFrame(loop)}
addEventListener('keydown',event=>{if(event.code==='Space'){event.preventDefault();flap()}});canvas.addEventListener('click',flap);document.getElementById('restart').onclick=()=>{reset();flap()};reset();
</script></body></html>
