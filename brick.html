<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Breaker - Pixel Party</title><link rel="stylesheet" href="styles.css"></head>
<body class="game-page"><div class="game-shell"><nav class="game-nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><a class="back-link" href="index.html">← all games</a></nav><header class="game-title"><p class="eyebrow">GAME 05</p><h1>Brick Breaker</h1><p>Clear the wall before the ball gets away.</p></header><main class="game-wrap"><div class="hud"><span>Score <strong id="score">0</strong></span><span id="status">Ready?</span></div><canvas id="game" width="560" height="420" aria-label="Brick Breaker game board"></canvas><p class="controls">Move with Left/Right or A/D - Press Space to launch</p><div class="mobile-controls" aria-label="Brick Breaker controls"><button type="button" data-brick="left" aria-label="Move paddle left">&#8592;</button><button type="button" data-brick="right" aria-label="Move paddle right">&#8594;</button></div><button class="game-button" id="restart">Start / restart</button></main></div>
<script>
const canvas=document.getElementById('game'),context=canvas.getContext('2d');let paddle,ball,bricks,score,running,frame,keys={left:false,right:false};
function reset(){cancelAnimationFrame(frame);paddle={x:240,y:390,w:80,h:12};ball={x:280,y:360,vx:4,vy:-4};bricks=[];score=0;running=false;for(let row=0;row<4;row++)for(let col=0;col<8;col++)bricks.push({x:35+col*63,y:45+row*25,w:54,h:14,live:true});document.getElementById('score').textContent='0';document.getElementById('status').textContent='Ready?';draw()}
function draw(){context.fillStyle='#20201e';context.fillRect(0,0,canvas.width,canvas.height);bricks.forEach((brick,index)=>{if(brick.live){context.fillStyle=['#ff7048','#ffc84a','#80b7ff','#b8e4cc'][index%4];context.fillRect(brick.x,brick.y,brick.w,brick.h)}});context.fillStyle='#fffdf8';context.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);context.fillStyle='#ffc84a';context.beginPath();context.arc(ball.x,ball.y,8,0,Math.PI*2);context.fill()}
function loop(){if(!running)return;if(keys.left)paddle.x=Math.max(0,paddle.x-7);if(keys.right)paddle.x=Math.min(canvas.width-paddle.w,paddle.x+7);ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<8||ball.x>canvas.width-8)ball.vx*=-1;if(ball.y<8)ball.vy=Math.abs(ball.vy);if(ball.y>paddle.y-10&&ball.y<paddle.y+paddle.h&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w)ball.vy=-Math.abs(ball.vy);bricks.forEach(brick=>{if(brick.live&&ball.x>brick.x&&ball.x<brick.x+brick.w&&ball.y>brick.y&&ball.y<brick.y+brick.h){brick.live=false;ball.vy*=-1;score+=10;document.getElementById('score').textContent=score}});if(ball.y>canvas.height){running=false;document.getElementById('status').textContent='Game over'}if(bricks.every(brick=>!brick.live)){running=false;document.getElementById('status').textContent='You cleared it!'}draw();if(running)frame=requestAnimationFrame(loop)}
function start(){reset();running=true;document.getElementById('status').textContent='Playing';loop()}
addEventListener('keydown',event=>{const key=event.key.toLowerCase();if(key==='arrowleft'||key==='a')keys.left=true;if(key==='arrowright'||key==='d')keys.right=true;if(key===' '&&!running){event.preventDefault();start()}});addEventListener('keyup',event=>{const key=event.key.toLowerCase();if(key==='arrowleft'||key==='a')keys.left=false;if(key==='arrowright'||key==='d')keys.right=false});document.querySelectorAll('[data-brick]').forEach(button=>{const direction=button.dataset.brick;const press=event=>{event.preventDefault();keys[direction]=true;if(!running)start()};const release=()=>keys[direction]=false;button.addEventListener('pointerdown',press);button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);button.addEventListener('pointerleave',release)});document.getElementById('restart').onclick=start;reset();
</script></body></html>
