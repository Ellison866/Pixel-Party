<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Breaker — Pixel Party</title><link rel="stylesheet" href="styles.css"></head><body class="game-page"><div class="game-shell"><nav class="game-nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> Pixel Party</a><a class="back-link" href="index.html">← all games</a></nav><header class="game-title"><p class="eyebrow">GAME 05</p><h1>Brick Breaker</h1><p>Clear the wall before the ball gets away.</p></header><main class="game-wrap"><div class="hud"><span>Score <strong id="score">0</strong></span><span id="status">Ready?</span></div><canvas id="game" width="560" height="420" aria-label="Brick Breaker game board"></canvas><p class="controls">Move with ← → or A D · Press Space to launch</p><button class="game-button" id="restart">Start / restart</button></main></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let paddle,ball,bricks,score,run,keys={};function reset(){paddle={x:240,y:390,w:80,h:12};ball={x:280,y:360,vx:4,vy:-4};bricks=[];score=0;run=false;for(let r=0;r<4;r++)for(let col=0;col<8;col++)bricks.push({x:35+col*63,y:45+r*25,w:54,h:14,live:true});document.getElementById('score').textContent=0;document.getElementById('status').textContent='Ready?';draw()}function draw(){x.fillStyle='#20201e';x.fillRect(0,0,c.width,c.height);bricks.forEach((b,i)=>{if(b.live){x.fillStyle=['#ff7048','#ffc84a','#80b7ff','#b8e4cc'][i%4];x.fillRect(b.x,b.y,b.w,b.h)}});x.fillStyle='#fffdf8';x.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);x.fillStyle='#ffc84a';x.beginPath();x.arc(ball.x,ball.y,8,0,7);x.fill()}function loop(){if(!run)return;if(keys.left)paddle.x=Math.max(0,paddle.x-7);if(keys.right)paddle.x=Math.min(c.width-paddle.w,paddle.x+7);ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<8||ball.x>c.width-8)ball.vx*=-1;if(ball.y<8)ball.vy=Math.abs(ball.vy);if(ball.y>paddle.y-10&&ball.y<paddle.y+paddle.h&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w)ball.vy=-Math.abs(ball.vy);bricks.forEach(b=>{if(b.live&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.live=false;ball.vy*=-1;score+=10;document.getElementById('score').textContent=score}});if(ball.y>c.height){run=false;document.getElementById('status').textContent='Game over'}if(bricks.every(b=>!b.live)){run=false;document.getElementById('status').textContent='You cleared it!'}draw();if(run)requestAnimationFrame(loop)}function start(){reset();run=true;document.getElementById('status').textContent='Playing';loop()}addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k===' '&&!run)start()});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false});document.getElementById('restart').onclick=start;reset()</script></body></html>
